name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy site files
        uses: appleboy/ssh-action@v1.2.0
        env:
          SHA: ${{ github.sha }}
        with:
          host: 2.24.130.130
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: SHA
          script: |
            set -euo pipefail
            cd /opt/sudoku

            # Every static file the page loads. Pinned to the pushed commit so
            # raw.githubusercontent.com's cache can't serve a stale copy.
            FILES="index.html puzzles.js"
            BASE="https://raw.githubusercontent.com/gbonenesiama/sudoku/${SHA}"

            # Download first so a failed fetch leaves the live site untouched.
            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            for f in $FILES; do
              curl -fsSL "$BASE/$f" -o "$tmp/$f"
            done

            # Each file is bind-mounted individually; add a mount for any file
            # that lacks one, cloned from the existing index.html mount line.
            for f in $FILES; do
              if ! grep -q "/usr/share/nginx/html/$f" docker-compose.yml; then
                grep -q "/usr/share/nginx/html/index.html" docker-compose.yml \
                  || { echo "index.html mount not found in docker-compose.yml"; cat docker-compose.yml; exit 1; }
                cp docker-compose.yml "docker-compose.yml.bak.$(date +%s)"
                sed -i "/\/usr\/share\/nginx\/html\/index\.html/{p;s/index\.html/$f/g}" docker-compose.yml
                echo "Added mount for $f"
              fi
            done

            for f in $FILES; do
              cp "$tmp/$f" "$f"
            done

            docker compose up -d --force-recreate
            docker compose ps

            # Verify nginx serves the new build.
            sleep 2
            # Save to files rather than piping into head, which would cut curl
            # off mid-download and fail the step under pipefail.
            curl -fsS http://localhost:8083/puzzles.js -o "$tmp/live-puzzles.js"
            curl -fsS http://localhost:8083/ -o "$tmp/live-index.html"
            cmp "$tmp/live-puzzles.js" puzzles.js
            grep -q 'src="puzzles.js"' "$tmp/live-index.html"
            echo "Deployed ${SHA}"
