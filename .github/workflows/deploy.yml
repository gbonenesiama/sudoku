name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy latest index.html
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 2.24.130.130
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /opt/sudoku
            curl -fsSL https://raw.githubusercontent.com/gbonenesiama/sudoku/main/index.html -o index.html
            docker compose up -d || docker compose restart
            echo 'Deploy complete'
